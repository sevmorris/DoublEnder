name: DoublEnder

options:
  bundleIdPrefix: io.github.sevmorris
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    # Public DoublEnder ("Local") build. The "lr" suffix mirrors Cloud's "cr"
    # so the build flavour is visible at a glance in the version overlay,
    # download filenames, and crash reports. release.sh's regex rewrites
    # match an optional letter suffix so future bumps stay self-consistent.
    MARKETING_VERSION: "1.7.5lr"
    CURRENT_PROJECT_VERSION: "19"

targets:
  DoublEnder:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: DoublEnder
        excludes:
          # Cloud-only sources live in the private overlay (gitignored).
          - "Views/CloudContentView.swift"
          - "Services/CloudConnectivity.swift"
          - "Services/Uploader.swift"
          - "Services/RecordingUploadMetadata.swift"
    settings:
      base:
        PRODUCT_NAME: DoublEnder
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sevmorris.DoublEnder
        BUNDLE_DISPLAY_NAME: DoublEnder
        DEFAULT_RECORDING_PREFIX: DoublEnder
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited)
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: DoublEnder/DoublEnder.entitlements
    info:
      path: DoublEnder/Info.plist
      properties:
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSMicrophoneUsageDescription: "DoublEnder needs microphone access to record audio."
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconName: "$(ASSETCATALOG_COMPILER_APPICON_NAME)"
        CFBundleDisplayName: "$(BUNDLE_DISPLAY_NAME)"
        DefaultRecordingPrefix: "$(DEFAULT_RECORDING_PREFIX)"

  DoublEnderTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: DoublEnderTests
        excludes:
          - "RecordingUploadMetadataTests.swift"
    dependencies:
      - target: DoublEnder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sevmorris.DoublEnderTests
