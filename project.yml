name: DoublEnder

options:
  bundleIdPrefix: io.github.sevmorris
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.5.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  DoublEnder:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: DoublEnder
        excludes:
          - "DoublEnderLite.entitlements"
    settings:
      base:
        PRODUCT_NAME: DoublEnder
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sevmorris.DoublEnder
        INFOPLIST_KEY_CFBundleDisplayName: DoublEnder
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited)
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: DoublEnder/DoublEnder.entitlements
    info:
      path: DoublEnder/Info.plist
      properties:
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSMicrophoneUsageDescription: "DoublEnder needs microphone access to record audio."
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"

  DoublEnderClient:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: DoublEnder
        excludes:
          - "DoublEnder.entitlements"
          - "DoublEnderLite.entitlements"
      - path: DoublEnderClient/doublender-10af32ff2d11.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: DoublEnder Client
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sevmorris.DoublEnderClient
        INFOPLIST_KEY_CFBundleDisplayName: DoublEnder Client
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconClient
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: GCS_ENABLED
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: DoublEnderClient/DoublEnderClient.entitlements
    info:
      path: DoublEnder/Info.plist
      properties:
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSMicrophoneUsageDescription: "DoublEnder needs microphone access to record audio."
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"

  DoublEnderLite:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: DoublEnder
        excludes:
          - "DoublEnder.entitlements"
    settings:
      base:
        PRODUCT_NAME: DoublEnder Lite
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sevmorris.DoublEnderLite
        INFOPLIST_KEY_CFBundleDisplayName: DoublEnder Lite
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: DoublEnder/DoublEnderLite.entitlements
    info:
      path: DoublEnder/Info.plist
      properties:
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSMicrophoneUsageDescription: "DoublEnder needs microphone access to record audio."
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
