name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # WaxOnWaxOff's build-and-test job, adapted: DoublEnder bundles no binaries,
    # and its project is generated from project.yml. The repo is public, so the
    # macOS runners are free.
    #
    # macos-26 because the recorder leans on writer behaviour measured on
    # 26.7 — the stereo pair's downmix gain (PCMSidecarTests writes every
    # layout through the writer) and a WAV written without a sample rate —
    # which a macos-15 job alone never checks. It also keeps 26 tested
    # when the development Mac moves on to 27.
    #
    # xcode-27 because releases are built with Xcode 27 on the owner's Mac, and
    # the 26.3 legs never compile what ships: the macOS 27 SDK and Swift 6.4.
    # Its image is macOS 27, the OS users move to next. GitHub calls it a public
    # preview, with no uptime promise.
    #
    # macos-26-intel because the app ships universal and nothing else runs its
    # x86_64 slice: the other legs and release.sh's tests are arm64. Intel Macs
    # stop at macOS 26, so it is also the newest OS that slice will meet.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            xcode: '26.3'
            arch: arm64
          - os: macos-26
            xcode: '26.3'
            arch: arm64
          - os: xcode-27
            xcode: '27.0'
            arch: arm64
          - os: macos-26-intel
            xcode: '26.3'
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # What the sibling apps pin: 26.3 on the macos-15 and macos-26
          # images, 27.0 (the release toolchain) on xcode-27.
          xcode-version: ${{ matrix.xcode }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        # project.yml is the source of truth, and release.sh regenerates
        # before it builds, so this does too. The Cloud overlay
        # (project.cloud.yml, DoublEnderCloud/) is private and not in this
        # tree, so this is the public build and DoublEnderTests.
        run: xcodegen generate --quiet

      - name: Build and test
        # ClipHack's cap: a wedged test host fails in minutes instead of
        # burning the job budget.
        timeout-minutes: 15
        run: |
          xcodebuild \
            -project DoublEnder.xcodeproj \
            -scheme DoublEnder \
            -configuration Debug \
            -destination 'platform=macOS,arch=${{ matrix.arch }}' \
            test
