name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # WaxOnWaxOff's build-and-test job, adapted: DoublEnder bundles no binaries,
    # and its project is generated from project.yml. The repo is public, so the
    # macOS runner is free.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # What the sibling apps pin.
          xcode-version: '26.3'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        # project.yml is the source of truth, and release.sh regenerates
        # before it builds, so this does too. The Cloud overlay
        # (project.cloud.yml, DoublEnderCloud/) is private and not in this
        # tree, so this is the public build and DoublEnderTests.
        run: xcodegen generate --quiet

      - name: Build and test
        # ClipHack's cap: a wedged test host fails in minutes instead of
        # burning the job budget.
        timeout-minutes: 15
        run: |
          xcodebuild \
            -project DoublEnder.xcodeproj \
            -scheme DoublEnder \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            test

      - name: Type-check the Cloud-only code (TEMPORARY, remove before merge)
        if: always()
        run: |
          cat > "$RUNNER_TEMP/CloudStubs.swift" <<'EOF'
          import Foundation
          import SwiftUI
          import Combine
          // Stands in for the private Cloud overlay's Uploader, as RecorderViewModel uses it.
          final class Uploader: ObservableObject {
              @Published var progress: Double = 0
              struct Began { let sessionURI: URL; let crc32c: String }
              enum UploaderError: Error {
                  case server(Int, String)
                  case missingKeyFile, malformedKeyFile, invalidPrivateKey, signingFailed
                  case integrityMismatch, integrityUnverified
                  var isNonRetryable: Bool { false }
              }
              func beginUpload(fileURL: URL) async throws -> Began { throw UploaderError.missingKeyFile }
              func continueUpload(fileURL: URL, sessionURI: URL, crc32cBase64: String) async throws {}
          }
          extension UserDefaults { static let app = UserDefaults.standard }
          struct WindowDragArea: View { var body: some View { Color.clear } }
          EOF
          xcrun swiftc -typecheck -parse-as-library -swift-version 5 -D GCS_ENABLED \
            -target arm64-apple-macos13.0 -sdk "$(xcrun --sdk macosx --show-sdk-path)" \
            DoublEnder/ViewModels/RecorderViewModel.swift \
            DoublEnder/Services/AudioEngine.swift \
            DoublEnder/Services/PCMSidecar.swift \
            DoublEnder/Services/NotificationService.swift \
            DoublEnder/Services/SessionHeartbeat.swift \
            DoublEnder/Utilities/*.swift \
            DoublEnder/Views/UploadConfirmationView.swift \
            "$RUNNER_TEMP/CloudStubs.swift"
